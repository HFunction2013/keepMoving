name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: msvc-${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, x86 ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test
        shell: pwsh
        continue-on-error: true
        run: ./scripts/smoke-test.ps1 -Exe build/keepMoving.exe -Arch ${{ matrix.arch }}

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/keepMoving.exe "dist/keepMoving-${{ matrix.arch }}.exe"
          Copy-Item README.md dist/README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keepMoving-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          cd artifacts
          for d in keepMoving-*; do
            (cd "$d" && zip -r "../${d}.zip" .)
          done
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.zip
          generate_release_notes: false
